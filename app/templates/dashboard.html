<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <div class="max-w-xl mx-auto bg-white p-6 rounded shadow">
    <h1 class="text-xl font-bold">Dashboard</h1>
    <p class="mt-2">Logged in as <strong>{{ user.email }}</strong></p>

    {% if email_status == "sent" %}
      <p class="mt-3 text-green-700 text-sm">Test email sent. Check your inbox (and spam).</p>
    {% elif email_status == "failed" %}
      <p class="mt-3 text-red-600 text-sm">Sending failed. Check the terminal for details.</p>
    {% endif %}

    <form method="post" action="/dashboard/test-email" class="mt-3">
      <button class="bg-green-600 text-white px-4 py-2 rounded">Send test email</button>
    </form>

    <button onclick="logout()" class="mt-4 bg-gray-800 text-white px-4 py-2 rounded">Log out</button>
  </div>

  <script>
    async function logout() {
      await fetch("/auth/logout", { method: "POST" });
      window.location = "/login";
    }
  </script>
</body>
</html>
