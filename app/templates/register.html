<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow w-80">
    <h1 class="text-xl font-bold mb-4">Create account</h1>
    <input id="email" type="email" placeholder="Email" class="border p-2 w-full mb-2">
    <input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2">
    <button onclick="register()" class="bg-blue-600 text-white p-2 w-full rounded">Register</button>
    <p id="msg" class="text-red-600 text-sm mt-2"></p>
    <p class="text-sm mt-2">Have an account? <a href="/login" class="text-blue-600">Log in</a></p>
  </div>
  <script>
    async function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const r = await fetch("/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      if (!r.ok) {
        document.getElementById("msg").textContent = "Could not register (email already used or invalid)";
        return;
      }
      const body = new URLSearchParams({ username: email, password });
      await fetch("/auth/login", { method: "POST", body });
      window.location = "/dashboard";
    }
  </script>
</body>
</html>
