<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow w-80">
    <h1 class="text-xl font-bold mb-4">Create account</h1>
    <input id="email" type="email" placeholder="Email" class="border p-2 w-full mb-2">
    <input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2">
    <button onclick="register()" class="bg-blue-600 text-white p-2 w-full rounded">Register</button>
    <p id="msg" class="text-red-600 text-sm mt-2"></p>
    <p class="text-sm mt-2">Have an account? <a href="/login" class="text-blue-600">Log in</a></p>
  </div>
  <script>
    async function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("msg");
      message.textContent = "";

      try {
        const response = await fetch("/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        if (!response.ok) {
          let error = null;
          try {
            error = await response.json();
          } catch {
            message.textContent = `The server returned an error (${response.status}). Check the server terminal for details.`;
            return;
          }

          if (error.detail === "REGISTER_USER_ALREADY_EXISTS") {
            message.textContent = "An account with this email already exists. Log in instead.";
          } else if (Array.isArray(error.detail)) {
            message.textContent = error.detail
              .map((item) => item.msg)
              .filter(Boolean)
              .join(". ");
          } else if (typeof error.detail === "string") {
            message.textContent = error.detail;
          } else {
            message.textContent = `Registration failed (${response.status}).`;
          }
          return;
        }

        const body = new URLSearchParams({ username: email, password });
        const loginResponse = await fetch("/auth/login", { method: "POST", body });
        if (!loginResponse.ok) {
          message.textContent = "Account created, but automatic login failed. Please log in.";
          return;
        }
        window.location = "/dashboard";
      } catch {
        message.textContent = "Could not contact the server. Check that it is running at this address, then try again.";
      }
    }
  </script>
</body>
</html>
