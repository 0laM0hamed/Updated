<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Log in</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded shadow w-80">
        <h1 class="text-xl font-bold mb-4">Log in</h1>
        <input id="email" type="email" placeholder="Email" class="border p-2 w-full mb-2">
        <input id="password" type="password" placeholder="Password" class="border p-2 w-full mb-2">
        <button onclick="login()" class="bg-blue-600 text-white p-2 w-full rounded">Log in</button>
        <p id ="msg" class="text-red-600 text-sm mt-2"></p>    
        <p class="text-sm mt-2">No account? <a href="/register" class="text-blue-600">Register</a></p>
    </div>
    <script>
        async function login() {
            const body = new URLSearchParams({
                username: document.getElementById('email').value,
                password: document.getElementById('password').value,
            });
            const r = await fetch('/auth/login', {
                method: 'POST',
                body,
            });
            if (r.ok) {
                window.location.href = '/dashboard';
            } else {
                document.getElementById('msg').textContent = 'Wrong email or password';
            }
        }
        </script>
        </body>
    </html>
